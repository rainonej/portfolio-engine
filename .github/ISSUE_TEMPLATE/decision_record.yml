name: Decision record
description: Track a human architecture/governance decision
title: '[Decision]: '
labels:
  - task:decision
  - source:human
body:
  - type: textarea
    id: question
    attributes:
      label: Decision question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      placeholder: |
        Option A:
        Option B:
        Option C:
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
  - type: textarea
    id: decision
    attributes:
      label: Final decision
      description: Leave blank until decided.
  - type: textarea
    id: consequences
    attributes:
      label: Consequences and follow-up tickets
