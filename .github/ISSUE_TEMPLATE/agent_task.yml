name: Agent task
description: A scoped task that may be safe for an AI coding agent
title: '[Agent task]: '
labels:
  - task:chore
  - source:human
  - owner:simple-ai
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for narrow, reviewable tasks. Broad design, architecture, security, dependency, release, and governance changes require human approval.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true after this task is complete?
    validations:
      required: true
  - type: dropdown
    id: target_layer
    attributes:
      label: Target layer
      options:
        - docs
        - examples/demo-site
        - packages/schema
        - packages/engine-core
        - packages/editorial-theme
        - packages/admin-tools
        - packages/workflow-kit
        - downstream consumer
        - unknown
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use checkboxes where possible.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should the agent avoid changing?
  - type: textarea
    id: validation
    attributes:
      label: Validation commands
      placeholder: |
        pnpm check
        pnpm build
  - type: textarea
    id: visual_qa
    attributes:
      label: Visual QA routes
      description: Required for UI changes.
      placeholder: |
        - /
        - /features
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This task does not require secrets, credentials, or production settings.
          required: true
        - label: This task does not change license, governance, security, publishing, or release policy.
          required: true
        - label: This task is narrow enough for one reviewable PR.
          required: true
