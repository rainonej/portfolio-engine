name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify dist/ presence for publishable packages
        run: |
          fail=0
          for pkg in packages/schema packages/engine-core packages/editorial-theme packages/admin-tools; do
            if [ ! -f "$pkg/dist/index.js" ]; then
              echo "::error::$pkg/dist/index.js is missing — build must produce dist/ before publish"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: Require npm publish token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo '::error::Repository secret NPM_TOKEN is not set. Add an npm automation token under Settings → Secrets and variables → Actions (see docs/workflows/release-workflow.md).'
            exit 1
          fi

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
