# Two-phase release on main:
# 1) Pending `.changeset/*.md` (from dev→main promotion) → `changeset version` + push (triggers this workflow again).
# 2) No pending changesets → build + `changeset publish` to npm.
#
# Use RELEASE_BOT_TOKEN when GitHub Actions cannot push to protected `main` (see docs/workflows/release-workflow.md).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version packages (Changesets)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip_publish: ${{ steps.export_gate.outputs.skip_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Detect pending changesets (no install)
        id: detect
        run: |
          set -euo pipefail
          pending=0
          shopt -s nullglob
          for f in .changeset/*.md; do
            base=$(basename "$f")
            if [ "$base" = "README.md" ]; then
              continue
            fi
            pending=1
            break
          done
          shopt -u nullglob
          echo "pending=${pending}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.pending == '1'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.pending == '1'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.pending == '1'
        run: pnpm install --frozen-lockfile

      - name: Apply changesets (push)
        id: version
        if: steps.detect.outputs.pending == '1'
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Pending changesets detected — running changeset version."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ref="${GITHUB_REF_NAME}"
          git fetch origin "${ref}"
          git reset --hard "origin/${ref}"

          # Re-check after syncing — a concurrent run may have already consumed the changesets.
          pending_after_sync=0
          shopt -s nullglob
          for f in .changeset/*.md; do
            base=$(basename "$f")
            [ "$base" = "README.md" ] && continue
            pending_after_sync=1; break
          done
          shopt -u nullglob
          if [ "$pending_after_sync" = "0" ]; then
            echo "Changesets already consumed by a concurrent run — proceeding to publish."
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before=$(git rev-parse HEAD)
          pnpm exec changeset version
          pnpm install --no-frozen-lockfile
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync lockfile after version bump"
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "::error::changeset version did not create a commit — check .changeset/config.json commit settings."
            exit 1
          fi

          git fetch origin "${ref}"
          if ! git rebase "origin/${ref}"; then
            echo "::error::Could not rebase version commits onto origin/${ref}. Another push landed on ${ref}; re-run Release after resolving."
            exit 1
          fi

          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${ref}"
          echo "Version commit pushed — npm publish runs on the next workflow run."
          echo "skip_publish=true" >> "$GITHUB_OUTPUT"

      - name: No pending changesets — publish may run
        id: version_pass
        if: steps.detect.outputs.pending == '0'
        run: |
          echo "No pending changesets — publishing phase may run."
          echo "skip_publish=false" >> "$GITHUB_OUTPUT"

      - name: Export skip_publish for publish job
        id: export_gate
        if: success()
        env:
          PENDING: ${{ steps.detect.outputs.pending }}
          FROM_VERSION: ${{ steps.version.outputs.skip_publish }}
          FROM_PASS: ${{ steps.version_pass.outputs.skip_publish }}
        run: |
          set -euo pipefail
          if [ "$PENDING" = "0" ]; then
            echo "skip_publish=${FROM_PASS}" >> "$GITHUB_OUTPUT"
          else
            echo "skip_publish=${FROM_VERSION}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.skip_publish != 'true'
    runs-on: ubuntu-latest
    permissions:
      # changeset publish creates @scope/pkg@x.y.z git tags — contents:write is required to push them.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync checkout to latest origin/main tip
        run: |
          set -euo pipefail
          git fetch origin main --tags
          checkout_head="$(git rev-parse HEAD)"
          main_head="$(git rev-parse origin/main)"
          if [ "$checkout_head" != "$main_head" ]; then
            echo "::notice::Publish job checkout head ($checkout_head) is behind origin/main ($main_head); resetting to origin/main."
            git reset --hard "$main_head"
          fi
          echo "Publishing from $(git rev-parse HEAD)."

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify dist/ presence for publishable packages
        run: |
          fail=0
          for pkg in packages/schema packages/engine-core packages/editorial-theme packages/admin-tools; do
            if [ ! -f "$pkg/dist/index.js" ]; then
              echo "::error::$pkg/dist/index.js is missing — build must produce dist/ before publish"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: Require npm publish token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo '::error::Repository secret NPM_TOKEN is not set. Add an npm automation token under Settings → Secrets and variables → Actions (see docs/workflows/release-workflow.md).'
            exit 1
          fi

      - name: Publish packages
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm registry matches main package versions
        run: |
          set -euo pipefail
          # npm propagation can lag publish by 10-30s; retry up to 6 times (90s total).
          max_attempts=6
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            mismatches=()
            for pkg in schema engine-core editorial-theme admin-tools; do
              local_ver="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('packages/${pkg}/package.json','utf8'));process.stdout.write(p.version)")"
              if ! remote_ver="$(npm view "@portfolio-engine/${pkg}" version 2>/dev/null)"; then
                mismatches+=("@portfolio-engine/${pkg}: main=${local_ver}, npm=<lookup failed>")
                continue
              fi
              if [ "$local_ver" != "$remote_ver" ]; then
                mismatches+=("@portfolio-engine/${pkg}: main=${local_ver}, npm=${remote_ver}")
              fi
            done
            if [ "${#mismatches[@]}" -eq 0 ]; then
              echo "npm registry versions match package versions on main."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Release verification failed: npm is not aligned with versions on main."
              echo "::error::Mismatched packages:"
              printf '::error:: - %s\n' "${mismatches[@]}"
              echo "::error::This usually means publish ran from the wrong commit or npm rejected publish for one or more packages."
              echo "::error::Re-run Release after checking the Publish to npm job logs and branch tip."
              exit 1
            fi
            echo "Attempt ${attempt}/${max_attempts}: registry not yet propagated — retrying in 15s..."
            sleep 15
          done

      # When every package is already on npm, `changeset publish` no-ops and does not create tags.
      # Still run `changeset tag` so Git Graph / tooling match registry versions.
      - name: Push package version tags to Git
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec changeset tag || true
          url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          while IFS= read -r t; do
            [ -n "${t}" ] || continue
            git push "${url}" "refs/tags/${t}" 2>/dev/null || true
          done < <(git tag --list '@portfolio-engine/*')
