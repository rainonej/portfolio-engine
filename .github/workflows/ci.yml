# Order: lint (fast) → typecheck + astro check → build → packed smoke
name: CI

on:
  pull_request:
    branches: [main, dev, 'epic/*']
  push:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML (workflows)
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable}}" .github/workflows/

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier (check)
        run: pnpm format

  check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check no public/ directories in packages
        run: |
          if find packages -name 'public' -type d -not -path '*/node_modules/*' | grep -q .; then
            echo "Error: public/ directory found inside packages/"
            find packages -name 'public' -type d -not -path '*/node_modules/*'
            exit 1
          fi

      - name: Typecheck + astro check (pnpm check)
        env:
          CI: 'true'
        run: pnpm check

      - name: Demo content boundary check
        working-directory: examples/demo-site
        run: node ../../packages/workflow-kit/templates/scripts/check-content-boundaries.mjs

      - name: Demo schema strictness check
        working-directory: examples/demo-site
        run: node ../../packages/workflow-kit/templates/scripts/check-schema-strictness.mjs

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages + examples (workspace)
        run: pnpm build

      - name: Build node-ssr fixture
        run: pnpm --filter node-ssr-demo run build

  smoke-packed:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Packed tarball consumer smoke test
        run: pnpm smoke:packed
