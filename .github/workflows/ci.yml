name: CI

on:
  pull_request:
    branches: [main, dev, "epic/*"]
  push:
    branches: [main, dev]

jobs:
  build:
    name: Lint, Check, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Build packages
        run: pnpm build
