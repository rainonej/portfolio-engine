# Portfolio Engine — downstream CI template
# Copy this to .github/workflows/ci.yml in your downstream repo.
# Adjust the filter names to match your repo's package name.

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier (check)
        run: pnpm format:check

  check:
    name: Types, docs & schema
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Content boundary check
        run: node scripts/check-content-boundaries.mjs

      - name: Schema strictness check
        run: node scripts/check-schema-strictness.mjs

      - name: Tooling version check
        run: pnpm check:tooling-version

  build:
    name: Build, smoke & links
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Static rendered-link check
        run: node scripts/check-rendered-links.mjs

      # Rendered interaction smoke — only runs if the downstream repo has opted in by
      # copying check-rendered-interactions.mjs to scripts/. This check uses Playwright
      # to verify that CTAs, cards, and navigation are actually clickable in a browser.
      # Static link checks (above) cannot catch overlay, pointer-events, or z-index issues.
      #
      # To enable: copy the template, install Playwright, and add check:rendered-interactions
      # to your package.json scripts.
      #   pnpm add -D @playwright/test
      #   pnpm exec playwright install --with-deps chromium
      #
      # Then uncomment the step below and set SITE_URL in your repository secrets or
      # pass a local server URL.
      #
      # - name: Rendered interaction smoke
      #   run: |
      #     if [ -f scripts/check-rendered-interactions.mjs ]; then
      #       pnpm check:rendered-interactions
      #     else
      #       echo "No rendered interaction smoke configured; skipping."
      #     fi
      #   env:
      #     SITE_URL: ${{ secrets.VERCEL_PREVIEW_URL }}

  unused:
    name: Dead code audit
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unused files and exports check
        run: pnpm check:unused
